<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generador de neteos</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
:root{--b:#2457e6;--bg:#f3f6fb;--ink:#152033}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf3ff,#f8fafc);font-family:Segoe UI,Arial;color:var(--ink)}main{max-width:1150px;margin:32px auto;padding:0 18px}.card{background:#fff;border:1px solid #e1e7f0;border-radius:20px;box-shadow:0 16px 45px #263c6225;padding:24px}h1{margin:0 0 6px}p{color:#667085}.drop{display:block;border:2px dashed #9fb1d1;border-radius:15px;padding:28px;text-align:center;background:#f8faff;cursor:pointer}.drop.drag{border-color:var(--b);background:#edf2ff}input{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:var(--b);color:#fff}button.alt{background:#edf2ff;color:#2349ac}button:disabled{opacity:.45}.status{padding:11px;border-radius:10px;display:none}.ok{display:block;background:#e9f8f1;color:#087a55}.err{display:block;background:#fff0ee;color:#b42318}.stats{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:14px 0}.stat{border:1px solid #dce3ed;border-radius:12px;padding:12px}.stat small{display:block;color:#667085}.stat b{font-size:18px;word-break:break-word}.tabs{display:flex;border-bottom:1px solid #dce3ed}.tab{background:none;color:#667085;border-radius:0}.tab.on{color:var(--b);border-bottom:3px solid var(--b)}section{display:none}section.on{display:block}pre{min-height:300px;max-height:610px;overflow:auto;background:#0d1729;color:#dbe7ff;border-radius:14px;padding:18px;white-space:pre;font:13px/1.55 Consolas,monospace}@media(max-width:650px){.stats{grid-template-columns:1fr}}
</style></head><body><main><div class="card"><h1>Generador de neteos</h1><p>Selecciona el Excel de neteos. La página detecta automáticamente la columna de códigos aunque existan filas o columnas vacías al inicio.</p><label id="drop" class="drop" for="file"><b>Seleccionar o arrastrar archivo Excel</b><br><small>.xlsx, .xls o .xlsb</small></label><input id="file" type="file" accept=".xlsx,.xls,.xlsb"><div id="status" class="status"></div><div class="actions"><button id="run" disabled>Procesar archivo</button><button id="copy" class="alt" disabled>Copiar LOGICA</button><button id="dlLogic" class="alt" disabled>Descargar LOGICA.txt</button><button id="dlStruct" class="alt" disabled>Descargar ESTRUCTURA.txt</button></div><div class="stats"><div class="stat"><small>Archivo</small><b id="filename">Sin cargar</b></div><div class="stat"><small>Hojas</small><b id="sheets">0</b></div><div class="stat"><small>Reglas</small><b id="rules">0</b></div></div><div class="tabs"><button class="tab on" data-id="logic">NETEOS</button><button class="tab" data-id="structure">ESTRUCTURA</button></div><section id="logic" class="on"><pre id="logicOut">Aquí aparecerá LOGICA.txt</pre></section><section id="structure"><pre id="structOut">Aquí aparecerá ESTRUCTURA.txt</pre></section></div></main><script>
(()=>{const $=x=>document.getElementById(x);let file=null,logic='',structure='';const numeric=v=>v!==null&&v!==undefined&&String(v).trim()!==''&&/^\d+(?:\.0+)?$/.test(String(v).trim());const clean=v=>v===null||v===undefined||(typeof v==='string'&&!v.trim())?null:v;const code=v=>String(v).trim().replace(/\.0+$/,'').replace(/\s/g,'');
function prepare(raw){if(!raw.length)return[];const width=Math.max(0,...raw.map(r=>r.length));let cc=-1,best=0;for(let c=0;c<width;c++){const n=raw.reduce((a,r)=>a+(numeric(r[c])?1:0),0);if(n>best){best=n;cc=c}}if(cc<0)return[];const first=raw.findIndex(r=>numeric(r[cc]));let rows=raw.slice(first).map(r=>r.slice(cc));const max=Math.max(0,...rows.map(r=>r.length));rows=rows.map(r=>Array.from({length:max},(_,i)=>clean(r[i])));const keep=[];for(let c=0;c<max;c++)if(c===0||rows.some(r=>r[c]!==null))keep.push(c);rows=rows.map(r=>keep.map(c=>r[c]));rows.unshift(Array(rows[0]?.length||0).fill(null));return rows}
function positions(rows){const out=Array.from({length:Math.max(0,(rows[0]?.length||0)-1)},()=>[]);rows.forEach((r,i)=>{for(let c=1;c<r.length;c++)if(r[c]!==null)out[c-1].push(i)});return out}
function sortLex(a){return[...new Set(a)].sort()}
function rulesFor(rows,name){const pos=positions(rows),out=[];for(let level=pos.length-1;level>0;level--){const parents=pos[level-1],children=pos[level];parents.forEach((p,i)=>{const end=i+1<parents.length?parents[i+1]:Infinity;const members=sortLex(children.filter(x=>x>p&&x<end).map(x=>'_'+code(rows[x][0])));if(members.length)out.push(`${name}= sumarnet_subnets(dmgrglobal, ${name}, "", "", {${members.join(',')}}, {_${code(rows[p][0])}}, "_")`)})}return out}
function structureFor(rows,name){const out=[`${name}   " ${name} "`,'Categorical [1..]','{'],items=[];for(let i=1;i<rows.length;i++){if(!numeric(rows[i][0]))continue;const v=code(rows[i][0]);const label=rows[i].slice(1).filter(x=>x!==null).map(String).join('').replace(/"/g,'\\"');items.push(`\t_${v} "${label}" [ Value =${v} ]`)}items.forEach((x,i)=>out.push(x+(i<items.length-1?',':'')));out.push('};','');return out.join('\n')}
function status(t,k){$('status').textContent=t;$('status').className='status '+k}function select(f){file=f;$('run').disabled=!f;$('filename').textContent=f?f.name:'Sin cargar';if(f)status('Archivo listo para procesar.','ok')}
$('file').onchange=e=>select(e.target.files[0]);['dragenter','dragover'].forEach(x=>$('drop').addEventListener(x,e=>{e.preventDefault();$('drop').classList.add('drag')}));['dragleave','drop'].forEach(x=>$('drop').addEventListener(x,e=>{e.preventDefault();$('drop').classList.remove('drag')}));$('drop').addEventListener('drop',e=>select(e.dataTransfer.files[0]));
$('run').onclick=async()=>{try{if(typeof XLSX==='undefined')throw Error('No se cargó el lector de Excel.');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),lb=[],sb=[];let ns=0,nr=0;for(const name of wb.SheetNames){if(!name.includes('_CODED'))continue;const raw=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:true});const rows=prepare(raw);if(!rows.length)throw Error(`No se identificaron códigos numéricos en ${name}.`);const r=rulesFor(rows,name);lb.push("                    '==============================================NETEOS==============================================\n"+r.join('\n'));sb.push(structureFor(rows,name));ns++;nr+=r.length}if(!ns)throw Error('No se encontraron hojas _CODED.');logic=lb.join('\n');structure=sb.join('\n');$('logicOut').textContent=logic;$('structOut').textContent=structure;$('sheets').textContent=ns;$('rules').textContent=nr;['copy','dlLogic','dlStruct'].forEach(x=>$(x).disabled=false);status(`Correcto: ${ns} hojas y ${nr} reglas generadas.`,'ok')}catch(e){status('Error: '+e.message,'err')}};
const dl=(text,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('copy').onclick=async()=>{await navigator.clipboard.writeText(logic);status('LOGICA copiada.','ok')};$('dlLogic').onclick=()=>dl(logic,'LOGICA.txt');$('dlStruct').onclick=()=>dl(structure,'ESTRUCTURA.txt');document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,section').forEach(x=>x.classList.remove('on'));t.classList.add('on');$(t.dataset.id).classList.add('on')})})();
</script></body></html>
